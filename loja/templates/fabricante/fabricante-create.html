{% extends "base.html" %}
{% load static %}
{% block title %}Novo Fabricante{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action="{% url 'create_fabricante' %}">
            {% csrf_token %}
            <div class="row">
                <label for="Fabricante" class="col-md-2">Fabricante</label>
                <input name="Fabricante">
            </div>
            <div class="row">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-check"></i> Inserir</button>
                <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
