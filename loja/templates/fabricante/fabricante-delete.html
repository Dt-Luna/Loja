{% extends "base.html" %}
{% load static %}
{% block title %}Excluir Fabricante{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action="{% url 'delete_fabricante' fabricante.id %}">
            {% csrf_token %}
            <div class="alert alert-warning">
                Deseja realmente excluir o fabricante {{ fabricante.Fabricante }}?
            </div>
            <div class="row">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-check"></i> Confirmar</button>
                <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
